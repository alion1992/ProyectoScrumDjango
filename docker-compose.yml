
services:
  django:
    build: .
    container_name: proyecto-scrum-django
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "192.168.100.8,localhost,127.0.0.1"
      DJANGO_DB_PATH: "/data/db.sqlite3"

    volumes:
      - django_data:/data

volumes:
  django_data:
